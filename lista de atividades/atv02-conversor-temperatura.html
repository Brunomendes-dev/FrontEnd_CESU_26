<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Conversor de Temperatura</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    .campo {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Conversor de Temperatura</h1>

    <div class="campo">
      <label>Celsius (°C)</label>
      <input type="number" id="celsius" step="0.1" placeholder="Digite em Celsius">
    </div>

    <div class="campo">
      <label>Fahrenheit (°F)</label>
      <input type="number" id="fahrenheit" step="0.1" placeholder="Digite em Fahrenheit">
    </div>
  </div>

  <script>
    document.getElementById('celsius').addEventListener('input', function() {
      var c = parseFloat(this.value);
      if (!isNaN(c)) {
        document.getElementById('fahrenheit').value = ((c * 9/5) + 32).toFixed(2);
      } else {
        document.getElementById('fahrenheit').value = '';
      }
    });

    document.getElementById('fahrenheit').addEventListener('input', function() {
      var f = parseFloat(this.value);
      if (!isNaN(f)) {
        document.getElementById('celsius').value = ((f - 32) * 5/9).toFixed(2);
      } else {
        document.getElementById('celsius').value = '';
      }
    });
  </script>

</body>
</html>
