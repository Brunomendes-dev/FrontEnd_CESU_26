<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Validador de CPF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.5em;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #resultado {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Validador de CPF</h1>
    <input type="text" id="cpf" placeholder="Digite o CPF (somente números)">
    <button onclick="validar()">Validar</button>
    <div id="resultado"></div>
  </div>

  <script>
    function validar() {
      var cpf = document.getElementById('cpf').value.replace(/\D/g, '');
      var resultado = document.getElementById('resultado');

      if (cpf.length !== 11) {
        resultado.style.color = 'red';
        resultado.textContent = 'CPF deve ter 11 dígitos!';
        return;
      }

      var soma = 0;
      for (var i = 0; i < 9; i++) {
        soma += Number(cpf[i]) * (10 - i);
      }
      var resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;

      if (resto !== Number(cpf[9])) {
        resultado.style.color = 'red';
        resultado.textContent = 'CPF Inválido!';
        return;
      }

      soma = 0;
      for (var i = 0; i < 10; i++) {
        soma += Number(cpf[i]) * (11 - i);
      }
      resto = (soma * 10) % 11;
      if (resto === 10) resto = 0;

      if (resto !== Number(cpf[10])) {
        resultado.style.color = 'red';
        resultado.textContent = 'CPF Inválido!';
        return;
      }

      resultado.style.color = 'green';
      resultado.textContent = 'CPF Válido!';
    }
  </script>

</body>
</html>
