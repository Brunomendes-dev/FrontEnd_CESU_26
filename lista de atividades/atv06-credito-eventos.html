<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Crédito para Festas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 380px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.4em;
    }

    select, input {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #resultado {
      margin-top: 20px;
      text-align: left;
      font-size: 1em;
      line-height: 2;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Infinity Bank - Crédito para Eventos</h1>

    <select id="pacote">
      <option value="">Selecione o pacote</option>
      <option value="50">Standard - R$ 50,00 por pessoa</option>
      <option value="80">Premium - R$ 80,00 por pessoa</option>
      <option value="120">Infinity Deluxe - R$ 120,00 por pessoa</option>
    </select>

    <input type="number" id="pessoas" placeholder="Quantidade de pessoas">

    <button onclick="calcular()">Calcular Orçamento</button>

    <div id="resultado"></div>
  </div>

  <script>
    function calcular() {
      var pacote = parseFloat(document.getElementById('pacote').value);
      var pessoas = parseInt(document.getElementById('pessoas').value);
      var resultado = document.getElementById('resultado');

      if (isNaN(pacote) || isNaN(pessoas) || pessoas <= 0) {
        resultado.innerHTML = '<span style="color:red">Preencha todos os campos!</span>';
        return;
      }

      var custoBase = pacote * pessoas;
      var taxaServico = custoBase * 0.10;
      var totalComTaxa = custoBase + taxaServico;

      var desconto = 0;
      if (pessoas > 100) {
        desconto = totalComTaxa * 0.05;
      }

      var totalFinal = totalComTaxa - desconto;

      var html = '<strong>Custo Bruto:</strong> R$ ' + custoBase.toFixed(2) + '<br>';
      html += '<strong>Taxa de Serviço (10%):</strong> R$ ' + taxaServico.toFixed(2) + '<br>';

      if (desconto > 0) {
        html += '<strong>Desconto Fidelidade (5%):</strong> - R$ ' + desconto.toFixed(2) + '<br>';
      }

      html += '<strong>Total Final:</strong> R$ ' + totalFinal.toFixed(2);

      resultado.innerHTML = html;
    }
  </script>

</body>
</html>
