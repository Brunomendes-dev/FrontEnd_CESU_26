<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title> Pet Virtual </title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body 
  class="min-h-screen flex flex-col items-center text-white"
  style="
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  "
>

  <div class="w-full flex items-center justify-start p-4 gap-4">

    <div class="avatar">
      <div class="w-16 rounded-full ring ring-primary ring-offset-2">
        <img src="cria_eat.png" />
      </div>
    </div>

    <div>
      <input 
        id="nomePet"
        type="text" 
        placeholder="Nome da criatura..." 
        class="input input-secondary text-black"
        oninput="atualizarNome()"
      />

      <h2 id="nomeExibido" class="text-xl mt-1"></h2>
    </div>

  </div>

  <p id="status" class="text-xl mt-4 bg-black/40 px-4 py-2 rounded">
    Estado: Vivo | Fome: 0
  </p>

  <div class="flex flex-col items-center w-full px-4 mt-10">

    <img 
      id="mainImage"
      src="cria_norm.png"
      class="w-full max-w-md"
    />

    <div class="mt-10">
      <img 
        src="btn_frut.png"
        class="w-32 cursor-pointer active:scale-90 transition"
        onclick="alimentar()"
      />
    </div>

  </div>

  <button 
    class="btn btn-primary mt-6"
    onclick="trocarManual()"
  >
  </button>

  <button 
    onclick="mostrarFerlini()" 
    style="position: fixed; bottom: 100px; right: 40px; opacity: 3.0;"
  >
    ?
  </button>

  <img 
    id="ferliniImg"
    src="ferlini.png"
    style="display: none; position: fixed; bottom: 60px; right: 50px; width: 300px;"
  />

  <script src="script.js"></script>
</body>
</html>
